  <main>

  <script>
/* Dockward scrolling annex. Positions and velocities are world units and units per second. */
(function(root,factory){
  const api=factory();
  if(typeof module==="object"&&module.exports)module.exports=api;
  if(root)root.DockwardModel=api;
})(typeof globalThis==="object"?globalThis:this,function createDockwardModel() {
  'use strict';
  const width=1120, height=440, viewWidth=384, viewHeight=216;
  const deckY=214, floorY=392, wallX=1056, ladderX=168;
  const crestEnd=992, wheelSpeed=115;
  const lift=Object.freeze({x:194,w:59,raised:242,lowered:347});
  const serviceLedge=Object.freeze({x:267,y:304,w:54,h:8,kind:'serviceLedge'});
  const sorter=Object.freeze({x:322,y:246,w:586,h:6,kind:'sorter'});
  const serviceCoil=Object.freeze({x:296,y:serviceLedge.y});
  const landmarks=Object.freeze({
    lift,serviceLedge,serviceCoil,sorter,sorterBell:Object.freeze({x:sorter.x+sorter.w-68}),
    cab:{x:121,y:deckY}, ladder:{x:ladderX,y:deckY,bottom:floorY},
    pump:{x:948,y:floorY}, rail:{x:wallX,y:deckY,bottom:floorY}, start:{x:112,y:floorY}
  });
  const solids=[
    {x:0,y:floorY,w:width,h:height-floorY,kind:'floor'},
    {x:50,y:deckY,w:96,h:12,kind:'catwalk'},
    {x:146,y:deckY,w:44,h:12,kind:'hatch'},
    {x:190,y:deckY,w:826,h:12,kind:'catwalk'},
    {x:322,y:252,w:53,h:40,kind:'shoulder'},
    {x:375,y:252,w:325,h:80,kind:'vault'},
    {x:700,y:252,w:56,h:40,kind:'shoulder'},
    {x:wallX,y:196,w:32,h:196,kind:'magneticWall'},
    serviceLedge,sorter

  for(const solid of solids)Object.freeze(solid);
  Object.freeze(solids);
  const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
  const overlaps=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  function create(saved){
    const old=saved?.flags||saved||{}, shortcut=old.shortcut===true;
    const flags={magnet:shortcut||old.magnet===true,shortcut};
    if(shortcut&&old.serviceCoil===true)flags.serviceCoil=true;

      flags,liftY:shortcut?lift.lowered:lift.raised,
      p:{x:landmarks.start.x,y:floorY-17,w:24,h:17,vx:0,vy:0,face:1,onGround:true,climbing:''},
      camera:{x:0,y:132,zoom:.76},time:0,event:'',

  }
  function snapshot(state){
    // The new upgrade is additive; a v1 cab save already has its crane cable released.
    return {version:1,flags:{...state.flags}};
  }
  function nearFloorPoint(p,point,reach){
    return Math.abs(p.x+p.w/2-point.x)<=reach&&Math.abs(p.y+p.h-point.y)<=10;
  }

    const gap=wallX-(p.x+p.w);

  }
  function prompt(state){
    const p=state.p,f=state.flags;
    if(p.climbing==='crest')return '';

    if(p.climbing==='ladder')return 'Up / down to climb';
    if(nearFloorPoint(p,landmarks.cab,34))return f.shortcut?'Crane winch released':'Use the winch to lower the service lift and ladder';
    if(nearFloorPoint(p,serviceCoil,27)&&f.serviceCoil)return 'Suspension coil installed';
    if(f.shortcut&&nearFloorPoint(p,landmarks.ladder,21))return 'Down to take the return ladder';
    if(f.shortcut&&nearFloorPoint(p,{x:ladderX,y:floorY},22))return 'Up to take the return ladder';
    if(nearFloorPoint(p,landmarks.pump,36))return f.magnet?'Magnetic wheels online':'Use the pump console to power the magnetic wheels';
    if(nearWall(p))return f.magnet?'Hold up against the magnetic rail':'Magnetic rail offline';

  function cue(s,name){
    if(s.event==='power'||s.event==='shortcut'||s.event==='serviceCoil')return;
    if(s.event!=='liftDock'||name==='serviceCoil')s.event=name;
  }
  function use(s){
    const p=s.p;
    if(!s.flags.magnet&&nearFloorPoint(p,landmarks.pump,36)){
      s.flags.magnet=true;cue(s,'power');
    }else if(!s.flags.shortcut&&nearFloorPoint(p,landmarks.cab,34)){
      s.flags.shortcut=true;cue(s,'shortcut');
    }
  }
  function overLift(p){
    return p.x<lift.x+lift.w&&p.x+p.w>lift.x;
  }
  function lowerLift(s,dt){
    if(!s.flags.shortcut||s.liftY>=lift.lowered)return;
    const p=s.p,old=s.liftY;
    s.liftY=Math.min(lift.lowered,old+48*dt);
    if(p.onGround&&!p.climbing&&overLift(p)&&Math.abs(p.y+p.h-old)<.01)p.y+=s.liftY-old;
    if(s.liftY===lift.lowered)cue(s,'liftDock');
  }
  function moveX(p,dt){
    const dx=p.vx*dt;
    if(!dx)return;
    const old=p.x;
    p.x=clamp(p.x+dx,0,width-p.w);
    for(const block of solids){
      if(!overlaps(p,block))continue;
      if(dx>0&&old+p.w<=block.x+.001)p.x=Math.min(p.x,block.x-p.w);
      if(dx<0&&old>=block.x+block.w-.001)p.x=Math.max(p.x,block.x+block.w);
      p.vx=0;
    }
  }
  function moveY(s,dt){
    const p=s.p,old=p.y,dy=p.vy*dt,wasGround=p.onGround,impact=p.vy;
    p.y+=dy;p.onGround=false;    for(const block of solids){
      if(!overlaps(p,block))continue;
      if(dy>0&&old+p.h<=block.y+.001){
        p.y=block.y-p.h;p.onGround=true;p.vy=0;
      }else if(dy<0&&old>=block.y+block.h-.001){
        p.y=block.y+block.h;p.vy=0;
      }
    }
    // Only the top of the suspended grating carries weight. The road below stays traversable.
    if(dy>0&&overLift(p)&&old+p.h<=s.liftY+.001&&p.y+p.h>=s.liftY){
      p.y=s.liftY-p.h;p.vy=0;p.onGround=true;
    }

  }
  function rail(s,input,dt){
    const p=s.p;

      p.vx=-wheelSpeed;p.x=Math.max(crestEnd,p.x-wheelSpeed*dt);p.face=-1;

    }else if(vert>0&&p.y>=floorY-p.h){
      p.climbing='';p.onGround=true;p.vy=0;

      p.climbing='';p.vx=-wheelSpeed*.75;p.vy=0;

  function ladder(s,input,dt){
    const p=s.p,vert=Number(!!input.down)-Number(!!input.up);
    p.vx=0;p.vy=vert*82;

      }

    if(p.climbing==='ladder')ladder(s,input,dt);
    else if(p.climbing)rail(s,input,dt);

      const direction=Number(!!input.right)-Number(!!input.left);
      if(direction)p.face=direction;
      // The powered rollers carry freight east to the pump unloading bay.
      const onSorter=p.onGround && Math.abs(p.y+p.h-sorter.y)<.01 &&
        p.x+p.w>sorter.x && p.x<sorter.x+sorter.w;

       Math.abs(p.y+p.h-serviceLedge.y)<.01&&Math.abs(p.x+p.w/2-serviceCoil.x)<17){
      s.flags.serviceCoil=true;cue(s,'serviceCoil');

    const open=clamp((p.x-180)/245,0,1);

    const feet=p.y+p.h;
    const followY=feet-frameH*.72;
    // Look down the unloading shaft before the belt takes the rover over its lip.
    const approach=clamp((p.x-(sorter.x+sorter.w-246))/142,0,1);
    const bay=clamp((wallX-40-p.x)/50,0,1);

  function step(s,input={},elapsed=1/60){
    s.event='';

  <script>
(function(root){
  const api=(function dockPaint(){
  'use strict';
  const W=1120,H=440,VW=384,VH=216;
  const beds=[['#344753','#40565c','#52635f'],['#384754','#415556','#4a5d5c'],['#435356','#586762','#67726a']];

  function distant(c,cx,cy,zoom){
    box(c,0,0,VW,VH,gradient(c,0,0,0,VH,[[0,'#273947'],[.33,'#426468'],[.72,'#648b83'],[1,'#8a9989']]));
    c.save();c.scale(zoom,zoom);c.translate(-round(cx*.18),-round(cy*.14));

    for(let i=0;i<14;i++){

  function masonry(c,x,y,w,h,salt){

        face(c,[[left+2,top+2],[left+bw-3,top+1],[left+bw*.66,top+3.5],[left+3,top+4]],p[1]);

  <script>
(function () {
  'use strict';
  const model = window.DockwardModel;
  const paint = window.DockwardPaint;
  const canvas = document.getElementById('dock');
  const context = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const play = document.getElementById('play');
  const pause = document.getElementById('pause');
  const audioButton = document.getElementById('audio');
  const status = document.getElementById('status');
  const back = document.getElementById('return');
  const embedded = window.parent !== window;
  const key = 'deep-relay-crane-dock-v1';
  const saved = name => {
    try { return JSON.parse(window.localStorage.getItem(name)) || {}; }
    catch (_) { return {}; }
  };
  if (!model || !paint) { status.textContent = 'Game files could not be loaded.'; return; }

  const campaign = saved('deep-relay-save-v2');
  const state = model.create({flags: {
    magnet: old.flags?.magnet === true || campaign.flags?.magnet === true,
    shortcut: old.flags?.shortcut === true,
    serviceCoil: old.flags?.serviceCoil === true
  }});
  const keyboard = new Map();
  const pointers = new Map();
  const pendingTap = new Set();
  const names = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',
    KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'jump',KeyE:'action'};
  let gamepad = {};
  let active = false;
  let last = 0;
  let frame = 0;
  let bank = 0;
  let feedback = '';
  let feedbackTime = 0;
  let synth = null;
  let sound = false;
  let lastPadPause = false;
  let padWatch = null;
  const controls = ['left','right','up','down','jump','action'];

    try { window.localStorage.setItem(key,JSON.stringify(model.snapshot(state))); } catch (_) {}
  }
  function clearInputs() {
    keyboard.clear(); pointers.clear(); pendingTap.clear(); gamepad = {};
  }
  function say(text) {
    if (status.textContent !== text) status.textContent = text;
  }
  function updateStatus() {
    say(feedbackTime > 0 ? feedback : model.prompt(state) || 'Crane Dock');
  }

    jump:[[95,.085,56,.045]], land:[[76,.11,38,.065]],
    climb:[[130,.065,87,.025]], power:[[130.8,.3,130.8,.08],[196,.4,196,.055],[261.6,.42,261.6,.042]],
    shortcut:[[155,.16,72,.065],[88,1.65,49,.045]],
    sorterBell:[[640,.19,630,.047],[962,.31,949,.024]],
    liftDock:[[71,.18,38,.09],[142,.28,91,.035]],
    serviceCoil:[[196,.20,196,.065],[246.94,.24,246.94,.052],[293.66,.48,293.66,.042]]

  }else if(location.protocol==='file:'&&!/\/(dockward\/index|prototype\/deep-relay-crane-dock)\.html$/i.test(location.pathname)){

  }

})();
